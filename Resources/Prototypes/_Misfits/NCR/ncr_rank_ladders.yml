    - min: 144000  # 40 hours
      rank: RankNCRStaffSergeant
    - min: 216000  # 60 hours
      rank: RankNCRSergeant1st
    - min: 288000  # 80 hours
      rank: RankNCRMasterSergeant
    - min: 360000  # 100 hours
      rank: RankNCR1stSergeant

