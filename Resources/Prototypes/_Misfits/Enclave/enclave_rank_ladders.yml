# #Cythisiax Edited - Enclave rank ladders (was ncrRankPinProgression). FactionRankSystem equips the earned pin at spawn;
# the pin is what gives the prefix. Ranks/prefixes live in _Misfits/FactionRank/ranks_enclave.yml.
#
# Tracker quick-reference (use with: playtime_addrole <user> <tracker> <time>)
#   EnclaveEnlisted           — Enclave Enlisted
#   EnclaveNCO                — Enclave NCO
#   EnclaveJuniorOfficer      — Enclave Junior Officer
#   EnclaveSeniorOfficer      — Enclave Senior Officer
#   EnclaveCommander          — Enclave Commander
#   EnclaveReformer           — The Reformer (fixed at General, admin-only)
#   EnclaveVertibirdPilot     — Enclave Vertibird Pilot
#   SuperMutantEnclave        — Enclave Supermutant

# Enlisted: PVT (E-1) → PFC (E-3) at 20h → SPC (E-4) at 40h
- type: rankLadder
  id: EnclaveEnlistedPins
  jobs:
    - EnclaveEnlisted
  tracker: EnclaveEnlisted
  departmentTracker: false
  thresholds:
    - min: 0
      rank: RankEnclavePrivate
    - min: 72000   # 20 hours
      rank: RankEnclavePFC
    - min: 144000  # 40 hours
      rank: RankEnclaveSpecialist

# NCO: SGT (E-5) → SSG (E-6) at 20h → SFC (E-7) at 40h → MSG (E-8) at 60h → SGM (E-9) at 80h
- type: rankLadder
  id: EnclaveNCOPins
  jobs:
    - EnclaveNCO
  tracker: EnclaveNCO
  departmentTracker: false
  thresholds:
    - min: 0
      rank: RankEnclaveSergeant
    - min: 72000   # 20 hours
      rank: RankEnclaveStaffSergeant
    - min: 144000  # 40 hours
      rank: RankEnclaveSFC
    - min: 216000  # 60 hours
      rank: RankEnclaveMasterSergeant
    - min: 288000  # 80 hours
      rank: RankEnclaveSergeantMajor

# Junior Officer: 2LT (O-1) → 1LT (O-2) at 20h
- type: rankLadder
  id: EnclaveJuniorOfficerPins
  jobs:
    - EnclaveJuniorOfficer
  tracker: EnclaveJuniorOfficer
  departmentTracker: false
  thresholds:
    - min: 0
      rank: RankEnclaveSecondLieutenant
    - min: 72000   # 20 hours
      rank: RankEnclaveFirstLieutenant

# Senior Officer: Captain (O-3) → Major (O-4) at 20h
- type: rankLadder
  id: EnclaveSeniorOfficerPins
  jobs:
    - EnclaveSeniorOfficer
  tracker: EnclaveSeniorOfficer
  departmentTracker: false
  thresholds:
    - min: 0
      rank: RankEnclaveCaptain
    - min: 72000   # 20 hours
      rank: RankEnclaveMajor

# Commander: LTC (O-5) → Colonel (O-6) at 20h
- type: rankLadder
  id: EnclaveCommanderPins
  jobs:
    - EnclaveCommander
  tracker: EnclaveCommander
  departmentTracker: false
  thresholds:
    - min: 0
      rank: RankEnclaveLtColonel
    - min: 72000   # 20 hours
      rank: RankEnclaveColonel

# Reformer: General (O-7), no ladder above it.
# Listed here because the Reformer shares EnclaveCommanderGear, which no longer carries a pin.
- type: rankLadder
  id: EnclaveReformerPins
  jobs:
    - EnclaveReformer
  tracker: EnclaveReformer
  departmentTracker: false
  thresholds:
    - min: 0
      rank: RankEnclaveGeneral

# Supermutant: PVT (E-1) → PFC (E-3) at 20h → SPC (E-4) at 40h → SGT (E-5) at 60h
# → SSG (E-6) at 80h → SFC (E-7) at 100h → MSG (E-8) at 120h → SGM (E-9) at 140h
# Walks the whole enlisted and NCO ladder in one billet, so it runs longer than either.
- type: rankLadder
  id: SuperMutantEnclavePins
  jobs:
    - SuperMutantEnclave
  tracker: SuperMutantEnclave
  departmentTracker: false
  thresholds:
    - min: 0
      rank: RankEnclavePrivate
    - min: 72000   # 20 hours
      rank: RankEnclavePFC
    - min: 144000  # 40 hours
      rank: RankEnclaveSpecialist
    - min: 216000  # 60 hours
      rank: RankEnclaveSergeant
    - min: 288000  # 80 hours
      rank: RankEnclaveStaffSergeant
    - min: 360000  # 100 hours
      rank: RankEnclaveSFC
    - min: 432000  # 120 hours
      rank: RankEnclaveMasterSergeant
    - min: 504000  # 140 hours
      rank: RankEnclaveSergeantMajor

# Vertibird Pilot: SGT (E-5) → SSG (E-6) at 20h → SFC (E-7) at 40h → MSG (E-8) at 60h → SGM (E-9) at 80h
# Misfits Change - Enclave Vertibird Pilot is no longer commissioned but instead has a rank structure that runs parallel to the NCO.
- type: rankLadder
  id: EnclaveVertibirdPilotPins
  jobs:
    - EnclaveVertibirdPilot
  tracker: EnclaveVertibirdPilot
  departmentTracker: false
  thresholds:
  - min: 0
    rank: RankEnclaveSergeant
  - min: 72000   # 20 hours
    rank: RankEnclaveStaffSergeant
  - min: 144000  # 40 hours
    rank: RankEnclaveSFC
  - min: 216000  # 60 hours
    rank: RankEnclaveMasterSergeant
  - min: 288000  # 80 hours
    rank: RankEnclaveSergeantMajor

# #Cythisiax Added - scientists hold a fixed rank; their pin is already in startingGear so no second one spawns.
- type: rankLadder
  id: EnclaveJuniorScientistRank
  jobs: [ EnclaveJuniorScientist ]
  thresholds:
  - rank: RankEnclaveJuniorScientist

- type: rankLadder
  id: EnclaveScientistRank
  jobs: [ EnclaveScientist ]
  thresholds:
  - rank: RankEnclaveScientist

- type: rankLadder
  id: EnclaveHeadScientistRank
  jobs: [ EnclaveHeadScientist ]
  thresholds:
  - rank: RankEnclaveHeadScientist
