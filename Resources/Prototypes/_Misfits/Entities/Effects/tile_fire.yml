- type: entity
  id: MisfitsTileFire
  name: fire
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _Misfits/Effects/fire.rsi
    noRot: true
    drawdepth: WallTops
    layers:
    - map: [ "base" ]
      state: red_4
  - type: PointLight
    radius: 5
    color: "#bf6d02"
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.TileFireLayers.Base:
        base:
          One: { state: red_1 }
          Two: { state: red_2 }
          Three: { state: red_3 }
          Four: { state: red_4 }
  - type: TileFire
    duration: 20
    bigFireDuration: 0.5
    extinguishInstantly: true
    vaporExtinguishSeconds: 2
    fireStacks: 0.35
    standingDamage: 0.15
    touchCooldown: 1
    # #Cythisiax Added - level ladder + spread; damage above is "at level 3"
    startLevel: 3
    maxLevel: 7
    growChance: 0.35
    spreadAtLevel: 3
    spreadChance: 0.12
    spreadFuelFraction: 0.8

- type: entity
  parent: MisfitsTileFire
  id: MisfitsTileFireOil
  name: lingering fire
  categories: [ HideSpawnMenu ]
  components:
  - type: TileFire
    duration: 30
    bigFireDuration: 0.5
    extinguishInstantly: true
    vaporExtinguishSeconds: 2
    fireStacks: 0.35
    standingDamage: 0.15
    touchCooldown: 1
    # #Cythisiax Added - oil: burns low and long, creeps rather than leaps
    startLevel: 3
    maxLevel: 6
    growChance: 0.25
    spreadAtLevel: 3
    spreadChance: 0.1
    spreadFuelFraction: 0.85
    spreadPrototype: MisfitsTileFire # catches as ordinary fire on new ground

- type: entity
  parent: MisfitsTileFire
  id: MisfitsTileFireNapalm
  name: napalm fire
  categories: [ HideSpawnMenu ]
  components:
  - type: TileFire
    duration: 45
    bigFireDuration: 0.75
    extinguishInstantly: true
    vaporExtinguishSeconds: 3
    fireStacks: 0.5
    standingDamage: 0.3
    touchCooldown: 1
    # #Cythisiax Added - napalm: starts hot, spreads hard, shrugs off rain and blood
    startLevel: 4
    maxLevel: 7
    growChance: 0.5
    spreadAtLevel: 3
    spreadChance: 0.18
    spreadFuelFraction: 0.8
    rainSpreadMultiplier: 0.75
    spreadPrototype: MisfitsTileFire # catches as ordinary fire on new ground
    bloodClearLevel: 6
