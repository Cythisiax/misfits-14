# #Cythisiax Added - Water plant POI: the only source of fresh clean water. Broken machines get
# repaired (weld, steel, cable, screw), then need power to fill their tank.

- type: entity
  parent: BaseStructure
  id: N14WaterPurifierBroken
  name: water treatment works
  description: A broken all in one water treatment machine. With some steel, cable and tools it might run again.
  suffix: POI, broken
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Machines/water_treatment.rsi
    layers:
    - state: watertreatment_broken
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.8,-0.5,0.8,0.4"
        density: 10000
        mask:
        - MachineMask
        layer:
        - MachineLayer
  # No Destructible on purpose: the wreck can never be removed, only repaired.
  - type: WaterPlantLandmark
  - type: Construction
    graph: N14WaterPurifier
    node: broken

- type: entity
  parent: N14WaterPurifierBroken
  id: N14WaterPurifier
  description: An all in one water treatment machine. It only treats water while it has power.
  suffix: POI
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Machines/water_treatment.rsi
    layers:
    - state: watertreatment
  - type: Construction
    graph: N14WaterPurifier
    node: working
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          N14WaterPurifierBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: ApcPowerReceiver
    powerLoad: 1500
  - type: ExtensionCableReceiver
  # Balance: starts empty, 1u of water a second while powered, up to a 500u tank.
  - type: WaterPurifier
    solution: well
    reagent: Water
    amount: 1
    interval: 1
  - type: SolutionContainerManager
    solutions:
      well:
        maxVol: 500
  - type: DrainableSolution
    solution: well
  - type: ReagentTank
