# #Cythisiax Added - Dirty-water versions of the plumbed sinks for the wasteland, where only
# water treatment machines (and stored tanks) give clean water. Vault and Enclave keep the clean ones.

- type: entity
  parent: Sink
  id: SinkDirtyWater
  suffix: Dirty Water
  components:
  - type: SolutionContainerManager
    solutions:
      drainBuffer:
        maxVol: 200
      tank:
        maxVol: 500
        reagents:
        - ReagentId: WaterDirty
          Quantity: 500
  - type: SolutionRegeneration
    solution: tank
    generated:
      reagents:
      - ReagentId: WaterDirty
        Quantity: 1

