# #Cythisiax Added - Rangers ranks: the job slot is the rank, no pin, the rank is stamped on their ID tag at spawn and that gives the prefix. Promotions go through the FactionRoster.

- type: factionRank
  id: RankNCRRangerRecruit
  name: Ranger Recruit
  prefix: Rct.
  color: "#6B8E23" # #Cythisiax Added - matches the faction radio channel color

- type: rankLadder
  id: NCRRangerRecruitRank
  jobs: [ NCRRangerRecruit ]
  thresholds:
  - rank: RankNCRRangerRecruit

