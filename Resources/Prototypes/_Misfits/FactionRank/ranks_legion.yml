# #Cythisiax Added - Legion ranks: the job slot is the rank, no pin, the rank is stamped on their ID tag at spawn and that gives the prefix. Promotions go through the FactionRoster.

- type: factionRank
  id: RankCaesarLegionLegionnaireRecruit
  name: Legionnaire
  prefix: Leg.
  color: "#8b0000" # #Cythisiax Added - matches the faction radio channel color

- type: rankLadder
  id: CaesarLegionLegionnaireRecruitRank
  jobs: [ CaesarLegionLegionnaireRecruit ]
  thresholds:
  - rank: RankCaesarLegionLegionnaireRecruit

