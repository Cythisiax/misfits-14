# #Cythisiax Added - BoS ranks: the job slot is the rank, no pin, the rank is stamped on their ID tag at spawn and that gives the prefix. Promotions go through the FactionRoster.

- type: factionRank
  id: RankBoSInitiate
  name: Initiate
  prefix: Init.
  color: "#3B72BF" # #Cythisiax Added - matches the faction radio channel color

- type: rankLadder
  id: BoSInitiateRank
  jobs: [ BoSInitiate ]
  thresholds:
  - rank: RankBoSInitiate

