- type: entity
  id: Bonfire
  parent: BaseStructure
  name: bonfire
  description: What can be better then late evening under the sky with guitar and friends.
  categories: [ HideSpawnMenu ]
  components:
  - type: HeatHaze # #Cythisiax Added - air shimmers above the fire
    innerRadius: 0.4
    outerRadius: 2.6
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/bonfire.rsi
    layers:
      - state: bonfire
      - state: burning
  - type: PointLight
    radius: 5
    energy: 3
    color: "#FFC90C"
  - type: FireFlicker # #Cythisiax Added - big open fire: slower wander, deeper dips
    amount: 0.25
    speed: 4
    dipChance: 0.12
    dipDepth: 0.45
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 50
        behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
  - type: AmbientSound
    volume: -5
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: AlwaysHot

- type: entity
  id: LegionnaireBonfire
  parent: Bonfire
  name: legionnaire bonfire
  description: There, in the land of lava and ash, place to to cook marshmallow and potato.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
      - state: legionnaire_bonfire
  - type: PointLight
    color: "#FF5601"
